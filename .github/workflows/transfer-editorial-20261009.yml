name: Transfer verified editorial patch (one-off)
on:
  push:
    branches: [work/bamboo-style-transfer-20261009]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'f2re/bamboo-seo-skill'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only the previously tested tree and verify it
        shell: bash
        env:
          BASE_SHA: 4eeeaebb39ca522bd76d66d9a38912a897da4e7c
          EXPECTED_TREE: cd92b1308fa8acb8566d044f36b6ce00313cc6cc
          PATCH_SHA: 79696edb7f1dbbb37d4e5a8ee31f1b63213ebe32df157be88f3a87e1e8bbc934
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/bamboo-style-transfer-20261009"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          curl --proto '=https' --tlsv1.2 -fLsS --max-time 45 'https://backend.composio.dev/api/v3/sl/GfWNgRxA0H' -o /tmp/bamboo-editorial.patch
          printf '%s  %s\n' "$PATCH_SHA" /tmp/bamboo-editorial.patch | sha256sum -c -
          git reset --hard "$BASE_SHA"
          git apply --index /tmp/bamboo-editorial.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python3 tools/sync_adapters.py --check
          python3 tools/check_evals.py
          python3 -m unittest discover -s tests -q
          test "$(git write-tree)" = "$EXPECTED_TREE"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          RESULT=$(printf '%s\n' 'chore: transfer verified Bamboo editorial 1.3.0 tree' | git commit-tree "$EXPECTED_TREE" -p "$GITHUB_SHA")
          git push origin "$RESULT:$GITHUB_REF"
          printf 'Verified result tree: %s\nCommit: %s\n' "$EXPECTED_TREE" "$RESULT"
